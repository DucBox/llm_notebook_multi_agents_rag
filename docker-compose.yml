services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_pass
      POSTGRES_DB: llm_notebook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://llm_user:llm_pass@db:5432/llm_notebook
      STORAGE_PATH: /app/storage/documents
      MAX_FILE_SIZE_MB: 50
      APP_VERSION: 1.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4.1-mini}
    volumes:
      - document_storage:/app/storage/documents
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
  document_storage:
  hf_cache:
