<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Notebook</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>

<!-- ── Top nav ───────────────────────────────────────────── -->
<header class="topnav">
  <div class="topnav-left">
    <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="topnav-logo">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="8" fill="#1a73e8"/>
        <path d="M10 28V14l10-6 10 6v14l-10 6-10-6z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 8v24M10 14l10 6 10-6" stroke="white" stroke-width="2"/>
      </svg>
      <span>LLM Notebook</span>
    </div>
  </div>
  <div class="topnav-right">
    <span id="user-email" class="user-email"></span>
    <button id="logout-btn" class="btn-ghost">Đăng xuất</button>
  </div>
</header>

<!-- ── Main layout ───────────────────────────────────────── -->
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <!-- Sources (top half) -->
    <section class="sidebar-section" id="sources-section">
      <div class="section-header">
        <span class="section-title">Nguồn tài liệu</span>
        <button id="add-source-btn" class="btn-add" title="Thêm nguồn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Thêm nguồn
        </button>
      </div>
      <div id="doc-list" class="doc-list">
        <div class="empty-hint">Chưa có tài liệu nào</div>
      </div>
    </section>

    <div class="sidebar-divider"></div>

    <!-- Sessions (bottom half) -->
    <section class="sidebar-section" id="sessions-section">
      <div class="section-header">
        <span class="section-title">Phiên chat</span>
        <button id="new-session-btn" class="btn-add" title="Tạo phiên mới">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Mới
        </button>
      </div>
      <div id="session-list" class="session-list">
        <div class="empty-hint">Chưa có phiên nào</div>
      </div>
    </section>

  </aside>

  <!-- Chat panel -->
  <main class="chat-panel" id="chat-panel">

    <!-- Empty state (no session selected) -->
    <div class="chat-empty" id="chat-empty">
      <svg width="64" height="64" viewBox="0 0 40 40" fill="none" opacity="0.2">
        <rect width="40" height="40" rx="8" fill="#1a73e8"/>
        <path d="M10 28V14l10-6 10 6v14l-10 6-10-6z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 8v24M10 14l10 6 10-6" stroke="white" stroke-width="2"/>
      </svg>
      <p>Chọn hoặc tạo phiên chat để bắt đầu</p>
    </div>

    <!-- Active chat (shown when session selected) -->
    <div class="chat-active hidden" id="chat-active">

      <!-- Chat top bar -->
      <div class="chat-topbar">
        <div class="chat-topbar-left">
          <!-- Token usage circle -->
          <button class="token-circle-btn" id="compact-btn" title="Click để compact lịch sử">
            <svg class="token-svg" viewBox="0 0 36 36">
              <circle class="token-track" cx="18" cy="18" r="15.9" fill="none" stroke-width="3"/>
              <circle class="token-fill" id="token-arc" cx="18" cy="18" r="15.9" fill="none" stroke-width="3"
                stroke-dasharray="0 100" stroke-linecap="round" transform="rotate(-90 18 18)"/>
            </svg>
            <span class="token-pct" id="token-pct">0%</span>
          </button>
          <span class="token-label">Context</span>
        </div>
        <div class="chat-topbar-right">
          <select id="rerank-select" class="topbar-select">
            <option value="false">Default</option>
            <option value="true">Re-rank</option>
          </select>
          <select id="model-select" class="topbar-select">
            <option value="default">GPT-4o mini</option>
          </select>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages"></div>

      <!-- Input bar -->
      <div class="input-bar">
        <textarea id="chat-input" class="chat-textarea" placeholder="Nhập câu hỏi..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" title="Gửi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

    </div>
  </main>
</div>

<!-- ── Upload modal ──────────────────────────────────────── -->
<div class="modal-overlay hidden" id="upload-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Thêm nguồn tài liệu</h3>
      <button class="modal-close" id="upload-close">&times;</button>
    </div>
    <div class="modal-body">
      <label class="file-drop-zone" id="file-drop-zone" for="file-input">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Kéo thả file hoặc <span class="link">chọn file</span></p>
        <p class="hint">PDF, TXT, Markdown • Tối đa 50MB mỗi file</p>
        <input type="file" id="file-input" multiple accept=".pdf,.txt,.md,.markdown" hidden />
      </label>
      <div id="upload-list" class="upload-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="upload-cancel">Huỷ</button>
      <button class="btn-primary" id="upload-confirm" disabled>Tải lên</button>
    </div>
  </div>
</div>

<!-- ── Preview modal ─────────────────────────────────────── -->
<div class="modal-overlay hidden" id="preview-modal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="preview-title">Xem trước tài liệu</h3>
      <button class="modal-close" id="preview-close">&times;</button>
    </div>
    <div class="modal-body" id="preview-body">
      <div class="preview-meta" id="preview-meta"></div>
      <div class="preview-chunks" id="preview-chunks"></div>
    </div>
  </div>
</div>

<!-- Scripts (load order matters) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/documents.js"></script>
<script src="js/sessions.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
