<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Notebook</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#1a73e8"/>
        <path d="M10 28V14l10-6 10 6v14l-10 6-10-6z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 8v24M10 14l10 6 10-6" stroke="white" stroke-width="2"/>
      </svg>
      <span>LLM Notebook</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Đăng nhập</button>
      <button class="auth-tab" data-tab="register">Đăng ký</button>
    </div>

    <div id="error-msg" class="auth-error hidden"></div>

    <form id="login-form" class="auth-form">
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@example.com" required autocomplete="email" />
      </div>
      <div class="field-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-full">Đăng nhập</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@example.com" required autocomplete="email" />
      </div>
      <div class="field-group">
        <label>Mật khẩu <span class="hint">(tối thiểu 8 ký tự)</span></label>
        <input type="password" id="reg-password" placeholder="••••••••" required autocomplete="new-password" minlength="8" />
      </div>
      <button type="submit" class="btn-primary btn-full">Tạo tài khoản</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
