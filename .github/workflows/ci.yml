name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llm_user
          POSTGRES_PASSWORD: llm_pass
          POSTGRES_DB: llm_notebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://llm_user:llm_pass@localhost:5432/llm_notebook_test
      STORAGE_PATH: /tmp/llm_storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create storage dir
        run: mkdir -p /tmp/llm_storage

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=term-missing

      - name: Run integration tests
        run: pytest tests/integration/ -v
